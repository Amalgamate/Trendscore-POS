services:
  shop-db:
    image: postgres:15-alpine
    container_name: retailos_shop_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - shop_postgres_data:/var/lib/postgresql/data

volumes:
  shop_postgres_data:
    external: true
    name: retailos_shop_postgres_data
