name: CI

on:
  push:
    branches: [main]
  pull_request:

# Instances pin to an immutable image tag. A floating :latest would make
# rollback impossible and would let a rebuild silently change what a shop
# is running. Version comes from the tag or the root package.json version.
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: amalgamate

jobs:
  # ---------------------------------------------------------------------
  # Phase 0 gate: types, tests, tokens, and both schemas.
  # ---------------------------------------------------------------------
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: shop_instance
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install
        run: npm ci

      # The repository has two independent Prisma schemas. Generate both
      # clients explicitly so typecheck uses the enums and models from each
      # schema instead of whichever client a package postinstall generated.
      - name: Generate Prisma clients
        run: |
          npm run db:generate:control
          npm run db:generate:shop

      - name: Generate design tokens
        run: npm run build:tokens

      # The POS token file includes the AppPalette light/dark theme extension
      # and typography APIs used by the app. Those are not emitted by the
      # base design-token generator, so whole-file equality is not a valid
      # drift check here.

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Validate control-plane schema
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/control_plane
          DIRECT_URL: postgresql://postgres:testpass@localhost:5432/control_plane
        run: npx prisma validate --schema apps/control-plane-api/prisma/schema.prisma

      - name: Validate shop-instance schema
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/shop_instance
          DIRECT_URL: postgresql://postgres:testpass@localhost:5432/shop_instance
        run: npx prisma validate --schema apps/shop-api/prisma/schema.prisma

      - name: Shop-instance migrations + immutability guarantees
        working-directory: apps/shop-api
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/shop_instance
          DIRECT_URL: postgresql://postgres:testpass@localhost:5432/shop_instance
        run: |
          npx prisma migrate deploy
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/verify-immutability.sql

  # ---------------------------------------------------------------------
  # Publish immutable, versioned images for shop instances.
  # Runs only on main. The provisioning engine (Phase 1) deploys these.
  # ---------------------------------------------------------------------
  publish:
    name: Publish images
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: shop-api
            context: ./apps/shop-api
            dockerfile: ./apps/shop-api/Dockerfile
          - name: shop-pos
            context: ./apps/shop_pos
            dockerfile: ./apps/shop_pos/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Derive version from git tag
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "main" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION}"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build-push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
